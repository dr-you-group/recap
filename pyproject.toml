[project]
name = "recap-m0"
version = "0.1.0"
description = "RECAP M0 reproducible source and evaluation foundations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  "pypdf>=5,<7",
  "pillow>=11,<13",
  "python-docx>=1.1,<2",
  "scikit-learn>=1.6,<2",
  "pypdfium2>=5,<6",
]

[project.scripts]
recap = "recap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recap"]

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
